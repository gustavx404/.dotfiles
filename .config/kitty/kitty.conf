# ~/.config/kitty/kitty.conf
# Tema gerenciado em current-theme.conf (Ayu Dark)
include current-theme.conf

# ============================================================================
#  ATALHOS — DESENHO PARA MAO ESQUERDA
#  Prefixo Ctrl+Shift (garra do mindinho) + uma tecla da metade esquerda do
#  teclado: Q W E R T / A S D F G / Z X C V B. Nada de numeros, setas,
#  PageUp/Home/End ou [ ]. Ajustes raros ficam num "leader": Ctrl+Shift+Q
#  seguido de outra tecla (toca, solta, toca -- sem segurar acorde).
#  NOTA: o kitty nao aceita comentario apos o valor na mesma linha; todo
#  comentario fica em linha propria.
# ============================================================================

# --- Janela ---
remember_window_size    no
initial_window_width    120c
initial_window_height   30c
window_padding_width    6 12
window_border_width     0
# fechar a janela nao abre dialogo de confirmacao (exigiria clique/mouse)
confirm_os_window_close  0

# --- Fonte ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Tabs (powerline) ---
tab_bar_style        powerline
tab_bar_edge         top
tab_bar_min_tabs     1
tab_powerline_style  slanted
tab_title_template   {index} {title}
tab_activity_symbol  *

# --- Layouts: habilita split de verdade + zoom de pane ---
enabled_layouts splits,stack

# ---------------------------------------------------------------------------
#  Zera TODOS os atalhos padrao do kitty. Muitos usam tecla de mao direita
#  ou viram prefixo de sequencia e colidiriam. Abaixo, so o esquema esquerdo.
# ---------------------------------------------------------------------------
clear_all_shortcuts yes

# Copiar / colar (padrao do kitty, ambas as teclas ficam a esquerda)
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

# --- Abas ---
# T nova aba (herda o diretorio atual) | W fecha | A/D anterior/proxima
map ctrl+shift+t  new_tab_with_cwd
map ctrl+shift+w  close_tab
map ctrl+shift+a  previous_tab
map ctrl+shift+d  next_tab
map ctrl+shift+1  goto_tab 1
map ctrl+shift+2  goto_tab 2
map ctrl+shift+3  goto_tab 3
map ctrl+shift+4  goto_tab 4

# --- Panes (janelas dentro da aba) ---
# S divide no eixo maior | E fecha o pane | R roda entre panes
map ctrl+shift+s  launch --location=split --cwd=current
map ctrl+shift+e  close_window
map ctrl+shift+r  next_window

# --- Tela / historico ---
# F limpa a tela (= Ctrl+L)
map ctrl+shift+f  send_text all \x0c
# B abre o historico no pager (busca com /)
map ctrl+shift+b  show_scrollback
# Z / X pulam para o prompt anterior / proximo (precisa shell integration)
map ctrl+shift+z  scroll_to_prompt -1
map ctrl+shift+x  scroll_to_prompt 1
# G mostra a saida do ultimo comando
map ctrl+shift+g  show_last_command_output

# ---------------------------------------------------------------------------
#  Leader: Ctrl+Shift+Q, depois a tecla (ajustes pouco frequentes)
#    W fonte maior   S fonte menor   D fonte no padrao
#    Z zoom do pane  C pane anterior
#    A move aba <-   F move aba ->   T tela cheia
#    B nova janela   G abrir URL     R recarrega config   E edita este arquivo
# ---------------------------------------------------------------------------
map ctrl+shift+q>w  change_font_size all +1.0
map ctrl+shift+q>s  change_font_size all -1.0
map ctrl+shift+q>d  change_font_size all 0
map ctrl+shift+q>z  toggle_layout stack
map ctrl+shift+q>c  previous_window
map ctrl+shift+q>a  move_tab_backward
map ctrl+shift+q>f  move_tab_forward
map ctrl+shift+q>t  toggle_fullscreen
map ctrl+shift+q>b  new_os_window
map ctrl+shift+q>g  kitten hints --type url
map ctrl+shift+q>r  load_config_file
map ctrl+shift+q>e  launch --type=overlay --cwd=current sh -c "${EDITOR:-vi} ~/.config/kitty/kitty.conf"

# --- Misc ---
scrollback_lines          20000
mouse_hide_wait           3
repaint_delay             10
input_delay               3
sync_to_monitor           yes
copy_on_select            clipboard
strip_trailing_spaces     smart
select_by_word_characters @-./_~?&=%+#
clipboard_control         write-clipboard write-primary read-clipboard read-primary
update_check_interval     0

# Bell: sem som, so aviso visual + marca na aba
enable_audio_bell       no
window_alert_on_bell    yes
bell_on_tab             "🔔 "

# Notifica no desktop quando um comando longo termina numa janela sem foco
notify_on_cmd_finish    unfocused 10.0

# Transparencia + blur (Ayu Dark)
background_opacity          0.85
background_blur             30
dynamic_background_opacity  yes

# Cursor: beam, sem piscar (igual estava no Alacritty)
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0
