# ~/.config/kitty/kitty.conf
# Tema gerenciado em current-theme.conf (Ayu Dark)
include current-theme.conf

# --- Janela ---
remember_window_size    no
initial_window_width    120c
initial_window_height   30c
window_padding_width    6 12
window_border_width     0

# --- Fonte ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Tabs (powerline) ---
tab_bar_style        powerline
tab_bar_edge        top
tab_bar_min_tabs    1
tab_powerline_style slanted
tab_title_template  {index}: {title}
tab_activity_symbol *

# --- Atalhos (mão esquerda, prefix Ctrl+Shift) ---
# Dispostos na fileira esquerda do teclado para digitar com uma mão
# Preserva defaults do Kitty (Ctrl+Shift+T nova aba, Ctrl+Shift+W fecha janela, etc).

# Abas: navegação
map ctrl+shift+a goto_tab 1
map ctrl+shift+s goto_tab 2
map ctrl+shift+d goto_tab 3
map ctrl+shift+f goto_tab 4

# Abas: manipulação
map ctrl+shift+w new_tab       # mesmo default, mas explicito
map ctrl+shift+z close_tab
map ctrl+shift+q move_tab_backward
map ctrl+shift+e move_tab_forward
map ctrl+shift+r set_tab_title
map ctrl+shift+x previous_tab
map ctrl+shift+c next_tab      # próxima aba

# Scroll / terminal
map ctrl+shift+u scroll_line_up
map ctrl+shift+i scroll_line_down
map ctrl+shift+o clear_terminal
map ctrl+shift+k clear_terminal stop scrollback

# Janelas (vizinhas)
map ctrl+shift+v neighboring_window left
map ctrl+shift+b neighboring_window right
map ctrl+shift+n next_prompt
map ctrl+shift+m previous_prompt

# Splits (layout vsplit = esquerda|direita; hsplit = cima|baixo)
map ctrl+shift+j launch --location=vsplit --cwd=current
map ctrl+shift+h launch --location=hsplit --cwd=current

# --- Shell ---
# Em branco = usa login shell (que virou zsh após `chsh`)
# (não colocamos `shell zsh` para não quebrar quem ainda tá com bash)

# --- Misc ---
scrollback_lines        10000
mouse_hide_wait         3
repaint_delay           10
input_delay             3
sync_to_monitor         yes
copy_on_select           clipboard

# Transparência + blur (Ayu Dark)
background_opacity       0.85
background_blur          30
dynamic_background_opacity yes

# Cursor
cursor_shape            beam
cursor_beam_thickness   1.5

# Agora, Ctrl+Shift+T nova aba, Ctrl+Shift+W fecha
