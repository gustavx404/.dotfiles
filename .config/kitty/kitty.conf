remember_window_size no
initial_window_width 120c
initial_window_height 30c

# Enable tabs with powerline separators (user's original style)
tab_bar_style powerline
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_powerline_style slanted
tab_title_template {index}: {title}
tab_activity_symbol *

# Ayu Dark theme
background #0A0E14
foreground #B3B1AD
cursor #FFB454
selection_background #3A3F4B
selection_foreground #B3B1AD

# BLACK - Ayu Dark
color0 #0A0E14
color8 #686868

# RED
color1 #FF6767
color9 #FF6767

# GREEN
color2 #AAD84C
color10 #AAD84C

# YELLOW
color3 #FFD173
color11 #FFD173

# BLUE
color4 #73D0FF
color12 #73D0FF

# MAGENTA
color5 #F29E74
color13 #F29E74

# CYAN
color6 #36A3D9
color14 #36A3D9

# WHITE
color7 #B3B1AD
color15 #D9D7CE

# TAB COLORS
active_tab_background #0A0E14
active_tab_foreground #FFD173
inactive_tab_background #0A0E14
inactive_tab_foreground #686868
tab_bar_background #0A0E14

# Font (adjust as needed - install JetBrainsMono Nerd Font if needed)
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# One-handed left-hand friendly keyboard shortcuts
# These shortcuts are designed for use with only the left hand
# Use Left Alt (Mod1) key - typically the left pinky button

# Tab navigation (left hand keys only)
# Use A, S, D, F, G on the left home row
map mod1+a goto_tab 1
map mod1+s goto_tab 2
map mod1+d goto_tab 3
map mod1+f goto_tab 4

# Tab movement (Q, W, E, R are also left hand)
map mod1+q move_tab_backward
map mod1+w new_tab
map mod1+e move_tab_forward
map mod1+r set_tab_title

# Close and next/previous tab (Z is left hand)
map mod1+z close_tab
map mod1+x previous_tab

# Scroll and navigation (U, I, O are left hand in some layouts)
map mod1+u scroll_line_up
map mod1+i scroll_line_down
map mod1+o clear_terminal

# Window navigation (V, B, N, M are near left hand)
map mod1+v neighboring_window left
map mod1+b neighboring_window right

# Terminal prompt navigation
map mod1+n next_prompt
map mod1+m previous_prompt

# Standard shortcuts remain accessible for multi-window setup:
# Use Ctrl+Shift+1-9 for window switching
# Ctrl+Shift+W for close window, Ctrl+Shift+T for new tab, etc.

# OTHER NICE SETTINGS
# Transparency settings - user requested these
scrollback_lines 10000
mouse_hide_wait 3
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Transparencia
background_opacity 0.85
background_blur 30
dynamic_background_opacity yes
