# ~/.config/kitty/kitty.conf
# Tema gerenciado em current-theme.conf (Ayu Dark)
include current-theme.conf

# --- Janela ---
remember_window_size    no
initial_window_width    120c
initial_window_height   30c
window_padding_width    6 12
window_border_width     0
hide_window_decorations yes

# --- Fonte ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Tabs (powerline) ---
tab_bar_style        powerline
tab_bar_edge        top
tab_bar_min_tabs    1
tab_powerline_style slanted
tab_title_template  {index}: {title}
tab_activity_symbol *

# --- Atalhos (mão esquerda, Alt) ---
# Navegação de abas
map mod1+a goto_tab 1
map mod1+s goto_tab 2
map mod1+d goto_tab 3
map mod1+f goto_tab 4

# Manipulação de abas
map mod1+q move_tab_backward
map mod1+w new_tab
map mod1+e move_tab_forward
map mod1+r set_tab_title
map mod1+z close_tab
map mod1+x previous_tab

# Scroll / terminal
map mod1+u scroll_line_up
map mod1+i scroll_line_down
map mod1+o clear_terminal

# Janelas
map mod1+v neighboring_window left
map mod1+b neighboring_window right
map mod1+n next_prompt
map mod1+m previous_prompt

# Novo split
map mod1+j launch --location=vsplit --cwd=current
map mod1+k launch --location=hsplit --cwd=current

# --- Shell ---
# Em branco = usa login shell (que virou zsh após `chsh`)
# (não colocamos `shell zsh` para não quebrar quem ainda tá com bash)

# --- Misc ---
scrollback_lines        10000
mouse_hide_wait         3
repaint_delay           10
input_delay             3
sync_to_monitor         yes
copy_on_select           clipboard

# Transparência + blur (Ayu Dark)
background_opacity       0.85
background_blur          30
dynamic_background_opacity yes

# Cursor
cursor_shape            beam
cursor_beam_thickness   1.5

# Agora, Ctrl+Shift+T nova aba, Ctrl+Shift+W fecha
