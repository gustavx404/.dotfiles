# ~/.config/kitty/kitty.conf
# Tema gerenciado em current-theme.conf (Ayu Dark)
include current-theme.conf

# --- Janela ---
remember_window_size    no
initial_window_width    120c
initial_window_height   30c
window_padding_width    6 12
window_border_width     0

# --- Fonte ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Tabs (powerline) ---
tab_bar_style        powerline
tab_bar_edge        top
tab_bar_min_tabs    1
tab_powerline_style slanted
tab_title_template  {index}: {title}
tab_activity_symbol *

# --- Atalhos (prefix Ctrl+Shift, mão esquerda) ---
# Abas: 1-6 navegam direto; W nova; Q fecha
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+w new_tab
map ctrl+shift+q close_tab

# Janelas dentro da aba: D direita, A esquerda, S split
map ctrl+shift+d neighboring_window right
map ctrl+shift+a neighboring_window left
map ctrl+shift+s launch --location=vsplit --cwd=current

# Limpar terminal
map ctrl+shift+f clear_terminal

# --- Shell ---
# Em branco = usa login shell (que virou zsh após `chsh`)
# (não colocamos `shell zsh` para não quebrar quem ainda tá com bash)

# --- Misc ---
scrollback_lines        10000
mouse_hide_wait         3
repaint_delay           10
input_delay             3
sync_to_monitor         yes
copy_on_select           clipboard

# Transparência + blur (Ayu Dark)
background_opacity       0.85
background_blur          30
dynamic_background_opacity yes

# Cursor
cursor_shape            beam
cursor_beam_thickness   1.5

# Agora, Ctrl+Shift+T nova aba, Ctrl+Shift+W fecha
