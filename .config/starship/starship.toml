# Starship prompt - Ayu Dark / azul como acento
# Paleta alinhada com kitty/.config/kitty/current-theme.conf

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$rust\
$cmd_duration\
$line_break\
$character"""

# ---- Paleta Ayu Dark ----
palette = "ayu_dark"

[palettes.ayu_dark]
bg       = "#0A0E14"
fg       = "#B3B1AD"
blue     = "#73D0FF"   # primária
cyan     = "#36A3D9"
green    = "#AAD84C"
yellow   = "#FFD173"
red      = "#FF6767"
magenta  = "#F29E74"
gray     = "#686868"

# ---- Módulos ----

[directory]
style = "fg:blue bold"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:red"

[git_branch]
symbol = " "
style = "fg:green bold"

[git_status]
style = "fg:yellow"
conflicted   = " "
ahead        = " ${count} "
behind       = " ${count} "
diverged     = "  ${ahead_count}  ${behind_count} "
untracked    = "?"
stashed      = "$"
modified     = "!"
staged       = "+"
renamed      = "»"
deleted      = "✘"
format       = "([$all_status$ahead_behind]($style) )"

[git_state]
style = "fg:magenta"

[python]
symbol = " "
style = "fg:yellow"

[nodejs]
symbol = " "
style = "fg:green"

[rust]
symbol = " "
style = "fg:red"

[cmd_duration]
min_time = 1_500
style = "fg:gray"
format   = "[ $duration]($style) "

# Prompt final (línea 2): azul como cor do símbolo
[character]
success_symbol = "[ ➜](fg:blue bold)"
error_symbol   = "[ ➜](fg:red bold)"
vicmd_symbol   = "[ ❮](fg:magenta bold)"
