# btop config — dotfiles repo
# Theme: Ayu Dark (azul #73D0FF)

color_theme = "ayu-dark"
theme_background = True
truecolor = True
force_tty = False
presets = "cpu:1:default,mem:0:default,net:0:default"
rounded_corners = True
graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"
shown_boxes = "cpu mem net proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_gradient = True
proc_per_core = True
proc_tree = False
proc_colors = True
proc_reversed = False
show_core_load = True
show_cpu_freq = True
show_disks = True
disk_filter_exclude = "/boot /efi"
pop_disk_part = True
show_uptime = True
show_battery = "Auto"
show_battery_watts = True
log_level = "WARNING"
background_update = True

# Layout
cpu_graph_upper = "Auto"
cpu_single_graph = True
disable = False
only_physical = True
use_fahrenheit = False
mem_graphs = True
show_swap = True
show_io_activity = True
io_mode = False
io_graph_combined = True
io_label = "Auto"

proc_left = ["modules"]
proc_top = ["CPU", "MEM", "PID", "USER", "NI", "S", "TIME", "R%", "W%", "T", "C%", "COMMAND"]
proc_bottom = []

net_download = 100
net_upload = 100
net_iface = "Auto"
net_sync = False
net_color_fixed = False
net_auto = True
net_filters = " "
char traffic_format = "auto"

clock_format = "%H:%M:%S %d/%m"
background_update = True

# vim_keys vi mode
vim_keys = False
