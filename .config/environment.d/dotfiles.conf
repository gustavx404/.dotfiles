# ~/.config/environment.d/dotfiles.conf
# Lido por systemd / Wayland sessions (Plasma 6, GNOME, KDE on Wayland)
# Garante que binários de usuário (~/.local/bin, ~/.cargo/bin, ~/.opencode/bin)
# estejam no PATH inclusive de programas lançados pela sessão gráfica
# (ex.: opencode rodado pelo KDE que precisa achar ai-memory em ~/.local/bin)
# Sintaxe environment.d: ${VARIABLE} expande o valor herdado.

PATH=/home/one/.local/bin:/home/one/.cargo/bin:/home/one/.opencode/bin:${PATH}

